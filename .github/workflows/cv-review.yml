# AI review of repository changes using GitHub Models (free tier).
#
# On every pull request, this workflow asks a free GitHub Models LLM to review
# the ENTIRE diff (all files, not just CV files) against the rules in
# AGENTS.md and posts its findings as a PR comment.
#
# Cost: free (GitHub Models free tier). No paid API keys required.
#
# Setup (one-time):
#   1. Create a fine-grained PAT with read access to "Models".
#      (The default GITHUB_TOKEN cannot call models.inference.ai.azure.com from
#      private repos / for most models.)
#   2. Add it as a repository secret named GH_MODELS_TOKEN:
#        Repo → Settings → Secrets and variables → Actions → New repository secret
#
# Optional configuration (via repository Variables, Settings → … → Variables):
#   REVIEW_MODEL  — model id on GitHub Models. Default: "gpt-4o-mini".
#                   Other free options: "gpt-4o", "DeepSeek-V3-0324",
#                   "Llama-3.3-70B-Instruct", "Mistral-Large-2411".
#
# Notes:
#   - GitHub Models free tier is rate-limited (~150 req/day, varies by model).
#     For a CV repo this is more than enough.
#   - The job FAILS (red ✗) when: the GH_MODELS_TOKEN secret is missing, the
#     GitHub Models API call errors out, or the AI review reports a BLOCKER
#     (rule violation / sync broken). Only a clean review (OK / NITs only)
#     leaves the job green. A PR with an empty diff (no changes) stays green.
#   - The review covers the ENTIRE PR diff (all files), not just CV files.

name: CV AI Review

on:
  pull_request: {}   # any PR, any files
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Cancel a previous run on the same PR when new commits are pushed.
concurrency:
  group: cv-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write     # needed to post the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    # Always run on PR. If the GH_MODELS_TOKEN secret is absent, the review
    # step skips gracefully and posts a "not configured" comment on the PR.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather review context (diff + AGENTS.md)
        id: ctx
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          # Full diff of the PR (all files in the repo), not just CV files.
          git fetch --depth=1 origin "${BASE_SHA}" 2>/dev/null || true
          DIFF="$(git diff "${BASE_SHA}..${HEAD_SHA}" || true)"

          if [ -z "${DIFF}" ]; then
            echo "Empty diff (no changes); skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # AGENTS.md is the rubric the reviewer must apply.
          RUBRIC="$(cat AGENTS.md 2>/dev/null || echo '(AGENTS.md not present)')"

          {
            printf '%s' "${DIFF}"
          } > /tmp/diff.txt
          printf '%s' "${RUBRIC}" > /tmp/rubric.txt

          # GitHub's payload size cap for comments is ~65000 chars; keep sane.
          python3 - <<'PY'
          import os, json, pathlib
          diff = pathlib.Path("/tmp/diff.txt").read_text(encoding="utf-8")
          rubric = pathlib.Path("/tmp/rubric.txt").read_text(encoding="utf-8")
          max_diff = 40000
          if len(diff) > max_diff:
              diff = diff[:max_diff] + "\n\n…[diff truncated]"
          pathlib.Path("/tmp/diff.truncated.txt").write_text(diff, encoding="utf-8")
          print("Diff chars:", len(diff), "| Rubric chars:", len(rubric))

      - name: Run AI review via GitHub Models
        id: ai
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          MODEL: ${{ vars.REVIEW_MODEL || 'gpt-4o-mini' }}
          ENDPOINT: https://models.inference.ai.azure.com/chat/completions
        run: |
          set -euo pipefail
          if [ -z "${GH_MODELS_TOKEN}" ]; then
            echo "::error::Secret GH_MODELS_TOKEN is not set. Configure it in Settings → Secrets → Actions (fine-grained PAT with Models:read scope). Failing the job as requested."
            exit 1
          fi

          # Build the chat request with a JSON array (no template-string quoting hell).
          python3 - <<'PY' > /tmp/req.json
          import json, pathlib
          rubric = pathlib.Path("/tmp/rubric.txt").read_text(encoding="utf-8")
          diff = pathlib.Path("/tmp/diff.truncated.txt").read_text(encoding="utf-8")

          system = (
              "You are a meticulous CV reviewer. You review git diffs of a CV "
              "that is maintained in two languages (English + Russian) and must "
              "stay in sync per the project rules (AGENTS.md). Be specific and "
              "concrete. Quote the offending line. Distinguish BLOCKER (sync "
              "broken, rule violation) from NIT (style). If the diff is fine, "
              "say so explicitly. Keep the answer under 400 words, markdown.\n\n"
              "OUTPUT FORMAT (mandatory):\n"
              "- Start with a one-line verdict: `VERDICT: OK` (no blockers) or "
              "`VERDICT: BLOCKER` (one or more blockers found).\n"
              "- Then a `## Findings` section listing each issue as "
              "`- [BLOCKER] ...` or `- [NIT] ...`."
          )
          user = (
              "Here is the project's rubric (AGENTS.md):\n\n"
              "``````markdown\n" + rubric + "\n``````\n\n"
              "Here is the diff under review:\n\n"
              "```diff\n" + diff + "\n```\n\n"
              "Review it. Check at minimum:\n"
              "- Both language files changed together (sync).\n"
              "- YAML front-matter `updated` timestamp bumped on changed files.\n"
              "- Experience/Skills bullet counts match across languages.\n"
              "- No phone number, no stray LinkedIn link.\n"
              "- First sentence of SUMMARY states years of experience.\n"
              "- No language leakage (RU words in EN file or vice versa).\n"
              "- The edit followed the rule to regenerate PDFs is a NIT only "
              "  (PDFs are not in the diff by design).\n"
          )
          print(json.dumps({
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user},
              ],
              "temperature": 0.2,
              "model": "__MODEL__",
          }))
          PY
          sed -i "s|__MODEL__|${MODEL}|" /tmp/req.json

          echo "Calling GitHub Models (${MODEL})…"
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X POST "${ENDPOINT}" \
                -H "Authorization: Bearer ${GH_MODELS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @/tmp/req.json)

          if [ "${HTTP}" != "200" ]; then
            echo "::error::GitHub Models request failed (HTTP ${HTTP})."
            echo "::error::$(head -c 1200 /tmp/resp.json)"
            exit 1
          fi

          python3 - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("/tmp/resp.json").read_text(encoding="utf-8"))
          content = data["choices"][0]["message"]["content"].strip()
          pathlib.Path("/tmp/review.md").write_text(content, encoding="utf-8")
          print("Review length:", len(content), "chars")

          # Parse verdict: fail the job if the model reported BLOCKER.
          # The system prompt asks for a leading "VERDICT: OK" / "VERDICT: BLOCKER"
          # line. As a fallback, also treat any "[BLOCKER]" bullet as a failure.
          verdict_line = next(
              (ln for ln in content.splitlines()
               if ln.strip().upper().startswith("VERDICT:")),
              "",
          )
          has_blocker_tag = "[BLOCKER]" in content.upper()
          is_blocker = "BLOCKER" in verdict_line.upper() or has_blocker_tag
          pathlib.Path("/tmp/verdict.txt").write_text(
              "BLOCKER" if is_blocker else "OK", encoding="utf-8")
          print("Verdict:", "BLOCKER" if is_blocker else "OK")
          PY
          echo "result=OK" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.existsSync('/tmp/review.md')
              ? fs.readFileSync('/tmp/review.md', 'utf8').trim()
              : '(no review produced — see workflow logs)';
            const model = '${{ vars.REVIEW_MODEL || 'gpt-4o-mini' }}';

            const banner = `🤖 **CV AI Review** — via GitHub Models (\`${model}\`, free tier)`;
            const body = `${banner}\n\n${review}`;

            const isPR = !!context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (isPR) {
              // Replace a previous bot comment instead of stacking duplicates.
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: context.issue.number,
              });
              const botHeader = '🤖 **CV AI Review**';
              for (const c of comments) {
                if (c.body && c.body.startsWith(botHeader)) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                }
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
              core.info('Posted/updated review comment on PR #' + context.issue.number);
            } else {
              // Manual run (workflow_dispatch) — log the review only.
              core.info('Not a PR; review output:\n\n' + body);
            }

      - name: Fail job if the review reported a BLOCKER
        if: steps.ctx.outputs.skip != 'true'
        run: |
          if [ ! -f /tmp/verdict.txt ]; then
            echo "::error::No verdict produced — the review step did not complete. See logs."
            exit 1
          fi
          VERDICT="$(cat /tmp/verdict.txt)"
          echo "Review verdict: ${VERDICT}"
          if [ "${VERDICT}" = "BLOCKER" ]; then
            echo "::error::CV AI review found BLOCKER(s). See the review comment on the PR. Fix them and re-push."
            exit 1
          fi
          echo "No blockers — job passes."
